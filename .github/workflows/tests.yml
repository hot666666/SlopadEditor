name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # AGENTS.md names `swift test --quiet` the canonical baseline for every executable
  # change, but until now no workflow ran it: CI covered the host-surface and naming
  # gates only, so a change could compile, keep the public lifecycle intact, and still
  # land with a failing suite.
  #
  # `--quiet` is dropped so swift-testing prints its own run summary. With it, a green
  # check said nothing about how many tests ran, and an empty suite looked identical to
  # a passing one.
  #
  # Parallel execution is kept. An earlier commit here reached for `--no-parallel` after
  # a suite started failing, and that was the wrong instinct: serializing the whole gate
  # slows every future run and hides whatever the concurrency actually exposed. A suite
  # that cannot run alongside others declares that itself with `.serialized`.
  baseline:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run the canonical baseline suite
        run: |
          # `|| status=$?` handles the failure inline, so `bash -e` does not kill the step
          # before the diagnosis below runs. Every earlier attempt to inspect the run
          # afterwards died with the suite itself — which is how both a hollow green and
          # an undiagnosed red reached this gate.
          set -o pipefail
          status=0
          swift test 2>&1 | tee baseline.log || status=$?
          echo "swift test exit status: ${status}"

          # A signal death and an ordinary test failure both end the run early, but they
          # need different fixes, so record which one happened. Shells report a signal as
          # 128+n, so 139 is SIGSEGV.
          if [ "$status" -gt 128 ]; then
            echo "::warning::the suite died on signal $((status - 128))"
          fi
          grep -aE 'Crash|signal|Fatal error|✘' baseline.log | tail -20 || true

          # Evidence is a count of tests that actually reported, not swift-testing's run
          # summary. The summary turned out to be unreliable output — one run printed it
          # and the next, from a passing suite with the same command, did not — and a gate
          # that rejects a green suite over a missing log line is worse than no gate.
          #
          # The exit status decides pass or fail. The count exists so that a run which
          # executes nothing cannot masquerade as a passing one.
          executed=$(grep -ac '✔ Test "' baseline.log || true)
          echo "baseline executed ${executed:-0} tests"

          # `|| true` matters here: an absent summary makes grep exit 1, and under
          # `bash -e` a failing command substitution in an assignment aborts the step.
          # This informational line was failing runs whose suite had already passed.
          summary=$(grep -aE 'Test run with [0-9]+ test' baseline.log | tail -1 || true)
          if [ -n "$summary" ]; then
            echo "baseline summary: ${summary}"
          fi

          if [ "${executed:-0}" -eq 0 ]; then
            echo "::error::the baseline executed zero tests"
            exit 1
          fi
          exit "$status"
