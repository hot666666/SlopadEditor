:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,

  font: inherit;
}

.btn {

  display: inline-flex;

  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;

}

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

}

  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;

  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {

  background: var(--secondary);

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  background-color: var(--secondary);

.form-select:focus-visible {

  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;section data-panel=&quot;state&quot; hidden aria-labelledby=&quot;sae-state-title&quot;&gt;
    &lt;h2 id=&quot;sae-state-title&quot;&gt;무엇이 진짜 원본이고, 무엇이 잠깐 생겼다가 사라지는가&lt;/h2&gt;
    &lt;div class=&quot;sae-pipelines&quot; aria-label=&quot;State projection pipelines&quot;&gt;
      &lt;div class=&quot;sae-pipeline&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;편집&lt;/span&gt;&lt;code&gt;Document&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;Document + composition&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;BlockLayout&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;TextKit prepared graph&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;EditorSessionSnapshot&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;span&gt;화면&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;sae-pipeline&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;저장&lt;/span&gt;&lt;code&gt;Document&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;EditorDocumentSnapshot.blocks&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;SlopadEditorArchive&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;span&gt;호스트 저장소&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;sae-pipeline&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;포맷&lt;/span&gt;&lt;span&gt;Markdown&lt;/span&gt;&lt;span&gt;⇄&lt;/span&gt;&lt;code&gt;[EditorBlockInput]&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;EditorDocumentPatch&lt;/code&gt;&lt;span&gt;→&lt;/span&gt;&lt;code&gt;Document&lt;/code&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sae-state-grid&quot;&gt;
      &lt;section&gt;&lt;h3&gt;영속 canonical document&lt;/h3&gt;&lt;p class=&quot;text-muted&quot;&gt;정의: CoreModel · 저장/변이 소유: EditorModel&lt;/p&gt;&lt;ul&gt;&lt;li&gt;block tree와 순서&lt;/li&gt;&lt;li&gt;&lt;code&gt;BlockID&lt;/code&gt;, kind, text, inline marks&lt;/li&gt;&lt;li&gt;트랜잭션으로만 변경&lt;/li&gt;&lt;li&gt;&lt;code&gt;EditorDocumentSnapshot.blocks&lt;/code&gt;로 전체 투영&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3&gt;semantic editor state&lt;/h3&gt;&lt;p class=&quot;text-muted&quot;&gt;EditorModel · undo 전후상에 포함&lt;/p&gt;&lt;ul&gt;&lt;li&gt;caret/text/block selection&lt;/li&gt;&lt;li&gt;&lt;code&gt;storedMarks&lt;/code&gt;&lt;/li&gt;&lt;li&gt;undo/redo transaction history&lt;/li&gt;&lt;li&gt;문서 저장 대상은 아님&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3&gt;runtime overlay&lt;/h3&gt;&lt;p class=&quot;text-muted&quot;&gt;Session 또는 AppKit · canonical 아님&lt;/p&gt;&lt;ul&gt;&lt;li&gt;IME composition과 composition selection&lt;/li&gt;&lt;li&gt;slash query/menu runtime&lt;/li&gt;&lt;li&gt;drag/rectangle/navigation context&lt;/li&gt;&lt;li&gt;viewport, focus, scroll, responder&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3&gt;derived / projection&lt;/h3&gt;&lt;p class=&quot;text-muted&quot;&gt;언제든 원본에서 재생성 가능&lt;/p&gt;&lt;ul&gt;&lt;li&gt;visible order, y/height index&lt;/li&gt;&lt;li&gt;TextLayout cache와 prepared store&lt;/li&gt;&lt;li&gt;attributed string/TextKit objects&lt;/li&gt;&lt;li&gt;render snapshot과 redraw facts&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
    &lt;/div&gt;
    &lt;p class=&quot;sae-table-caption&quot;&gt;핵심 판별: &lt;code&gt;visibleBlocks&lt;/code&gt;는 화면용이고 저장 원본이 아니다. ADR 0015의 &lt;code&gt;SlopadEditorArchive&lt;/code&gt; v1은 &lt;code&gt;formatVersion + canonical preorder blocks&lt;/code&gt;만 담는 pure codec이다. public API는 CoreModel product를 노출하지 않고 &lt;code&gt;BlockID&lt;/code&gt;, &lt;code&gt;BlockKind&lt;/code&gt;, &lt;code&gt;BlockContent&lt;/code&gt;, &lt;code&gt;TextRange&lt;/code&gt;, &lt;code&gt;EditorBlockInput&lt;/code&gt;의 type-identical alias만 선별한다. raw wire를 먼저 검증해 malformed marks를 정규화 성공으로 바꾸지 않으며, 파일/DB/cloud/autosave/conflict는 host가 소유한다. live IME는 effective content에는 보이지만 &lt;code&gt;documentSnapshot&lt;/code&gt;에는 마지막 published committed state만 들어간다.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section data-panel=&quot;textkit&quot; hidden aria-labelledby=&quot;sae-textkit-title&quot;&gt;
    &lt;h2 id=&quot;sae-textkit-title&quot;&gt;계약은 좁게 나누고, 구현은 한 TextKit 문맥으로 묶는다&lt;/h2&gt;
    &lt;div class=&quot;sae-coherence&quot; aria-label=&quot;Coherent TextKit path&quot;&gt;
      &lt;div&gt;&lt;strong&gt;소비자별 좁은 계약&lt;/strong&gt;&lt;br&gt;&lt;code&gt;BlockMeasuring&lt;/code&gt;&lt;br&gt;&lt;code&gt;Geometry / Navigation / Deletion&lt;/code&gt;&lt;/div&gt;
      &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
      &lt;div&gt;&lt;strong&gt;&lt;code&gt;TextKitTextSystem&lt;/code&gt;&lt;/strong&gt;&lt;br&gt;layouter + renderer&lt;br&gt;하나의 context&lt;/div&gt;
      &lt;span class=&quot;arrow&quot;&gt;→&lt;/span&gt;
      &lt;div&gt;&lt;strong&gt;prepared entry&lt;/strong&gt;&lt;br&gt;NSTextStorage → ContentStorage → LayoutManager → Container&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sae-textkit-grid&quot;&gt;
      &lt;section&gt;&lt;h3&gt;BlockLayout&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;&lt;code&gt;BlockMeasuring&lt;/code&gt;만 주입&lt;/li&gt;&lt;li&gt;높이·baseline만 요청&lt;/li&gt;&lt;li&gt;caret/word 의미를 다루지 않음&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3&gt;EditorSession&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;geometry, hit test&lt;/li&gt;&lt;li&gt;bidi/word navigation&lt;/li&gt;&lt;li&gt;deletion range&lt;/li&gt;&lt;li&gt;답을 받아 selection/history를 적용&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3&gt;AppKit UI&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;같은 system의 renderer 사용&lt;/li&gt;&lt;li&gt;fragment text와 caret/selection feedback&lt;/li&gt;&lt;li&gt;active block pin을 render 전에 전달&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
      &lt;section&gt;&lt;h3&gt;Prepared store&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;key = request value + style&lt;/li&gt;&lt;li&gt;96 entries / 6 MiB estimated cost&lt;/li&gt;&lt;li&gt;동일 BlockID 새 revision 교체&lt;/li&gt;&lt;li&gt;warning: active만, critical: 전체 purge&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
    &lt;/div&gt;
    &lt;div class=&quot;table-responsive&quot;&gt;
      &lt;table class=&quot;table table-sm&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;능력&lt;/th&gt;&lt;th&gt;질문&lt;/th&gt;&lt;th&gt;의미 최종 결정자&lt;/th&gt;&lt;th&gt;금지되는 우회&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;BlockMeasuring&lt;/code&gt;&lt;/td&gt;&lt;td&gt;이 block의 높이는?&lt;/td&gt;&lt;td&gt;BlockLayout이 cache/invalidation 소유&lt;/td&gt;&lt;td&gt;Session이 직접 measure&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;TextGeometryResolving&lt;/code&gt;&lt;/td&gt;&lt;td&gt;caret·line·point 위치는?&lt;/td&gt;&lt;td&gt;backend가 사실 제공, Session이 문서 좌표로 투영&lt;/td&gt;&lt;td&gt;UI가 backend 직접 질의&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;TextNavigationResolving&lt;/code&gt;&lt;/td&gt;&lt;td&gt;bidi/word 이동 결과는?&lt;/td&gt;&lt;td&gt;backend fact + Session selection transition&lt;/td&gt;&lt;td&gt;TextKit이 canonical selection 변경&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;code&gt;TextDeletionResolving&lt;/code&gt;&lt;/td&gt;&lt;td&gt;무슨 범위를 지울까?&lt;/td&gt;&lt;td&gt;backend range + EditorModel transaction&lt;/td&gt;&lt;td&gt;adapter가 text 직접 삭제&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section data-panel=&quot;hosts&quot; hidden aria-labelledby=&quot;sae-hosts-title&quot;&gt;
    &lt;h2 id=&quot;sae-hosts-title&quot;&gt;사용자는 어느 입구를 선택하는가&lt;/h2&gt;

      &lt;table class=&quot;table&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;사용자&lt;/th&gt;&lt;th&gt;의존 제품&lt;/th&gt;&lt;th&gt;주요 표면&lt;/th&gt;&lt;th&gt;책임&lt;/th&gt;&lt;th&gt;도달하면 안 되는 것&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;일반 macOS host&lt;/td&gt;&lt;td&gt;&lt;code&gt;SlopadEditorAppKit&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;AppKitEditorViewController&lt;/code&gt;, action, style, update, snapshots&lt;/td&gt;&lt;td&gt;문서 저장·host chrome·lifecycle&lt;/td&gt;&lt;td&gt;raw TextKit graph, EditorModel 내부&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;SwiftUI host&lt;/td&gt;&lt;td&gt;&lt;code&gt;SlopadEditorSwiftUI&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;SlopadEditor&lt;/code&gt;와 observable model&lt;/td&gt;&lt;td&gt;mount → edit → observe → flush → replace → unmount&lt;/td&gt;&lt;td&gt;controller 우회, package API&lt;/td&gt;&lt;/tr&gt;

          &lt;tr&gt;&lt;td&gt;개발/검증&lt;/td&gt;&lt;td&gt;DebugApp, UIBenchmarkApp, fixtures&lt;/td&gt;&lt;td&gt;scenario, benchmark, public compile proof&lt;/td&gt;&lt;td&gt;실제 edge 검증&lt;/td&gt;&lt;td&gt;production owner로 취급&lt;/td&gt;&lt;/tr&gt;

      &lt;/table&gt;
    &lt;/div&gt;
    &lt;p class=&quot;sae-table-caption&quot;&gt;&lt;code&gt;SlopadEditorAppKit&lt;/code&gt;은 compile-time facade다. 두 번째 controller, Session, document, cache를 만들지 않는다. #78의 archive codec-surface probe와 lifecycle probe가 한 fixture package에 있어도 target/source와 dependency/import audit는 분리한다.&lt;/p&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }

  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {

    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {

    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
